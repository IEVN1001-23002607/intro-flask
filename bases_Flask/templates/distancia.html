    {% extends "layout.html" %}
    {%block container%}
    <h1>Distancia</h1>
    
    <div class="container">
        <div class="raw">
           <div class="col-6">
             <form action="/distancia" method="post">
                <div class="form-group pt-4">
                    <label for="n1">Numero 1: </label>
                    <input  name="n1" type="number" id="n1" class="form-control" placeholder="Ingrese numero 1">
                </div>
                <div class="form-group pt-4">

                    <label for="n2">Numero 2: </label>
                    <input  type="number" id="n2" name="n2" class="form-control" placeholder="Ingrese numero 2">
                </div>
                <div class="form-group pt-4">

                    <label for="n3">Numero 3: </label>
                    <input  type="number" id="n3" name="n3" class="form-control" placeholder="Ingrese numero 3">
                </div>
                <div class="form-group pt-4">

                    <label for="n4">Numero 4: </label>
                    <input  type="number" id="n4" name="n4" class="form-control" placeholder="Ingrese numero 4">
                </div>
                
                
                
                <button type="submit" class="btn btn-primary">calcular</button>


            </form>
           </div>
           <div class="col-6">

            <h2>Resultado: {{"%.2f"|format(res)}}</h2>
           </div>
        </div>
    </div>

    {%endblock%}
